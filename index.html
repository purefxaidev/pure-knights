<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PURE Knights — ขุนพลแห่งตำนาน</title>
<meta name="description" content="เกม RPG เทิร์นเบสสะสมฮีโร่ แนวนอน/แนวตั้ง จับขุนพล บอสยักษ์ อัปสกิล เล่นแล้วได้เหรียญ PURE พากย์ไทยด้วย Gemini">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- global resource bar -->
  <header id="topbar">
    <button id="tb-back" class="tb-back" data-go="home" aria-label="กลับ">‹</button>
    <div id="tb-title"></div>
    <div class="resbar">
      <div class="res"><span class="ic sm" style="--m:url(../assets/ui/ic_bolt.webp)"><img src="assets/ui/ic_bolt.webp" alt=""></span><b id="r-stam">150/150</b></div>
      <div class="res"><span class="ic sm" style="--m:url(../assets/ui/ic_coins.webp)"><img src="assets/ui/ic_coins.webp" alt=""></span><b id="r-gold">0</b><button class="plus" data-go="quests">+</button></div>
      <div class="res"><span class="ic sm" style="--m:url(../assets/ui/ic_ruby.webp)"><img src="assets/ui/ic_ruby.webp" alt=""></span><b id="r-gems">0</b><button class="plus" data-go="summon">+</button></div>
      <div class="res pure" data-go="wallet"><span class="ic sm" style="--m:url(../assets/ui/ic_pure.webp)"><img src="assets/ui/ic_pure.webp" alt=""></span><b id="r-pure">0</b><button class="plus" data-go="wallet">+</button></div>
    </div>
    <div class="tb-icons"><button class="ib" data-soon="กล่องจดหมาย"><span class="ic " style="--m:url(../assets/ui/ic_mail.webp)"><img src="assets/ui/ic_mail.webp" alt=""></span></button><button class="ib" data-soon="แชท"><span class="ic " style="--m:url(../assets/ui/ic_chat.webp)"><img src="assets/ui/ic_chat.webp" alt=""></span></button><button class="ib set" data-go="settings" aria-label="ตั้งค่า"><span class="ic " style="--m:url(../assets/ui/ic_gear.webp)"><img src="assets/ui/ic_gear.webp" alt=""></span></button></div>
  </header>

  <!-- LOBBY -->
  <section id="home" class="screen active">
    <div class="lobby-bg"></div><div class="lobby-shade"></div><div class="petals"></div>
    <div class="player" data-go="heroes"><div class="avatar"><img id="pl-ava" alt=""></div><div><b id="pl-name">ผู้กล้าแห่งเพียว</b><div class="pl-sub"><span id="pl-lv">Lv.1</span><span class="vip">VIP 0</span></div><div class="plpow" id="pl-pow"></div></div></div>
    <div class="side-menu">
      <button data-soon="อันดับ"><span class="ic " style="--m:url(../assets/ui/ic_crown.webp)"><img src="assets/ui/ic_crown.webp" alt=""></span>อันดับ</button><button data-soon="เพื่อน"><span class="ic " style="--m:url(../assets/ui/ic_friends.webp)"><img src="assets/ui/ic_friends.webp" alt=""></span>เพื่อน</button>
      <button data-soon="กิลด์"><span class="ic " style="--m:url(../assets/ui/ic_guild.webp)"><img src="assets/ui/ic_guild.webp" alt=""></span>กิลด์</button><button data-go="wallet"><span class="ic " style="--m:url(../assets/ui/ic_exchange.webp)"><img src="assets/ui/ic_exchange.webp" alt=""></span>แลกเปลี่ยน</button>
    </div>
    <div class="lob-right">
      <div class="logo"><img src="assets/logo.webp" alt="PURE Knights" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="l1" style="display:none">PURE Knights</div></div>
      <button class="rateup" data-go="summon"><img id="ru-art" alt=""><i class="arr l">‹</i><i class="arr r">›</i><span class="ribbon">Rate Up!</span><div class="ru-txt"><small id="ru-tag">อัญเชิญพิเศษ</small><b id="ru-name"></b><span class="ru-st">★★★★★</span></div></button>
      <div class="events">
        <button data-soon="กิจกรรม"><span class="ic " style="--m:url(../assets/ui/ic_gift.webp)"><img src="assets/ui/ic_gift.webp" alt=""></span>กิจกรรม<i class="dot on"></i></button>
        <button id="ev-checkin"><span class="ic " style="--m:url(../assets/ui/ic_calendar.webp)"><img src="assets/ui/ic_calendar.webp" alt=""></span>เช็กอิน<i class="dot" id="ci-dot"></i></button>
        <button data-soon="พาส"><span class="ic " style="--m:url(../assets/ui/ic_pass.webp)"><img src="assets/ui/ic_pass.webp" alt=""></span>พาส<i class="dot on"></i></button>
        <button data-go="quests"><span class="ic " style="--m:url(../assets/ui/ic_quest.webp)"><img src="assets/ui/ic_quest.webp" alt=""></span>ภารกิจ<i class="dot" id="q-dot"></i></button>
      </div>
      <div class="modes">
        <button class="mode m-story" data-go="map"><b>เนื้อเรื่อง</b><small id="md-prog"></small></button>
        <button class="mode m-special" data-go="map" data-arg="boss"><b>พิเศษ</b><small>บอสยักษ์</small></button>
        <button class="mode m-arena" data-soon="อารีน่า"><b>อารีน่า</b><small>เร็วๆ นี้</small></button>
        <button class="mode m-raid" data-soon="เรด"><b>เรด</b><small>เร็วๆ นี้</small></button>
      </div>
      <button class="start-btn" data-go="map"><span class="sw"></span><img class="sx" src="assets/ui/ic_sword.webp" alt=""><span>เริ่มผจญภัย</span></button>
    </div>
    <nav class="bottom-bar">
      <button data-go="heroes"><span class="ic " style="--m:url(../assets/ui/ic_helmet.webp)"><img src="assets/ui/ic_helmet.webp" alt=""></span>ตัวละคร<i class="dot on"></i></button><button data-go="heroes" data-arg="team"><span class="ic " style="--m:url(../assets/ui/ic_chess.webp)"><img src="assets/ui/ic_chess.webp" alt=""></span>จัดทีม</button>
      <button data-soon="อุปกรณ์"><span class="ic " style="--m:url(../assets/ui/ic_sword.webp)"><img src="assets/ui/ic_sword.webp" alt=""></span>อุปกรณ์</button><button data-go="heroes"><span class="ic " style="--m:url(../assets/ui/ic_upgrade.webp)"><img src="assets/ui/ic_upgrade.webp" alt=""></span>อัปเกรด</button>
      <button data-go="summon"><span class="ic " style="--m:url(../assets/ui/ic_gem.webp)"><img src="assets/ui/ic_gem.webp" alt=""></span>อัญมณี<i class="dot on"></i></button><button data-go="heroes" data-arg="skill"><span class="ic " style="--m:url(../assets/ui/ic_star.webp)"><img src="assets/ui/ic_star.webp" alt=""></span>สกิล<i class="dot on"></i></button>
      <button data-go="collection"><span class="ic " style="--m:url(../assets/ui/ic_book.webp)"><img src="assets/ui/ic_book.webp" alt=""></span>คอลเลกชัน<i class="dot on"></i></button>
    </nav>
  </section>

  <section id="map" class="screen"><div class="map-wrap" id="map-wrap"><img class="map-img" id="map-img" alt=""><svg id="map-path"></svg><div id="map-nodes"></div></div><div class="map-title" id="map-title"></div></section>
  <section id="heroes" class="screen"><div class="wrap"><div class="tabs" id="h-tabs"></div><div class="panel-h">ทีมของฉัน <small>(สูงสุด 5 · แตะเพื่ออัปเกรด)</small></div><div id="team-slots"></div><div class="panel-h">ฮีโร่ทั้งหมด <small id="roster-count"></small></div><div id="roster"></div></div></section>
  <section id="hero" class="screen"><div class="wrap" id="hero-detail"></div></section>
  <section id="collection" class="screen"><div class="wrap"><div class="panel-h">คอลเลกชัน <small id="col-count"></small></div><div id="col-grid"></div></div></section>
  <section id="summon" class="screen"><div class="summon-bg"></div>
    <div class="summon-ui"><div class="banner-card" id="sum-banner"></div>
      <p class="rates">UR 2% · SSR 10% · SR 30% · R 58% — ขุนพล (General) อัญเชิญไม่ได้ ต้อง "จับ" ในด่าน!</p>
      <div class="row"><button class="btn gold" id="sum1">อัญเชิญ x1<br><small>💎 100</small></button><button class="btn gold" id="sum10">อัญเชิญ x10<br><small>💎 900 · การันตี SR+</small></button></div></div>
    <div id="summon-result"></div></section>
  <section id="quests" class="screen"><div class="wrap"><div class="panel-h">ภารกิจรายวัน <small>รีเซ็ตทุกวัน</small></div><div id="quest-list"></div><p class="note" id="cap-note"></p></div></section>
  <section id="wallet" class="screen"><div class="wrap" id="wallet-body"></div></section>
  <section id="settings" class="screen"><div class="wrap" id="settings-body"></div></section>

  <section id="battle" class="screen">
    <canvas id="bcanvas"></canvas>
    <div id="bhud">
      <div class="b-left"><div class="b-logo"><img src="assets/logo.webp" alt=""></div><div class="b-info"><div id="bwave"></div><div class="b-sub"><span class="b-stars">★★★</span><span class="b-timer">⏱ <b id="b-time">00:00</b></span></div></div></div>
      <div class="bbtns"><button id="b-menu" class="rb" aria-label="เมนู"><i class="bars"></i></button><button id="b-speed" class="rb">x1</button><button id="b-auto" class="rb">Auto</button><button id="b-exit" class="rb" aria-label="ออก">✕</button></div>
    </div>
    <div id="turncol"></div><div id="turnbar" style="display:none"></div>
    <div id="bossbar"><div class="bm"><img alt=""></div><div class="bi"><div class="bn"><b></b><em class="bl"></em></div><div class="bb"><i></i><span class="bt"></span></div><div class="bdebuf"><u></u><u></u><u></u><u></u><u></u><u></u></div></div></div>
    <div id="bpanel">
      <div id="bactive"><div class="ba-ava"><img alt=""></div><div class="ba-info"><div class="ba-nm"><span class="ba-lv"></span><b></b></div><div class="ba-hp"><i></i><span></span></div><div class="ba-en"><i></i><span></span></div></div></div>
      <div id="bskills"><button class="bsk sk"><img alt=""><span class="cdv"></span><em></em></button><button class="bsk ult"><img alt=""><span class="cdv"></span><em></em></button></div>
      <div id="bcards"></div>
    </div>
  </section>
</div>

<div id="story"><img class="st-art" alt=""><div class="st-box"><b class="st-name"></b><p class="st-text"></p><small>แตะเพื่อไปต่อ ›</small></div><button class="st-skip">ข้าม ⏭</button></div>
<div id="cutin"><div class="ci-lines"></div><div class="ci-band"></div><img class="ci-art" alt=""><div class="ci-text"><div class="ci-name"></div><div class="ci-skill"></div><div class="ci-tag">ท่าไม้ตาย</div></div></div>
<div id="ultvid"><video playsinline muted preload="auto"></video><div class="uv-name"></div><button class="uv-skip">ข้าม ⏭</button></div>
<div id="modal"><div class="modal-box"></div></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/voice.js"></script>
<script src="js/fx.js"></script>
<script src="js/battle.js"></script>
<script src="js/game.js"></script>
</body>
</html>
